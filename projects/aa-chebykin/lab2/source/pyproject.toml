[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "lab2-local-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.6",
  "sentence-transformers==5.7.0",
  "huggingface-hub==0.36.2",
  "qdrant-client==1.20.0",
  "fastembed==0.7.4",
  "langchain-text-splitters==1.1.3",
  "pymupdf4llm==0.3.4",
  "pymupdf==1.27.1",
  "pymupdf-layout==1.27.1",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
  "jinja2>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "truststore>=0.10,<1",
  "psutil>=7,<8",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
lab2 = "core.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
cache-dir = "../data/.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
