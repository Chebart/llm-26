[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "lab3-postgres-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1,<2",
  "openai>=2,<4",
  "mcp>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
  "pglast>=7,<8",
  "langfuse>=3,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "typer>=0.16,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "qdrant-client>=1.15,<2",
  "transformers>=5.22,<6",
  "huggingface-hub>=1,<2",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=5,<6", "fastembed>=0.7,<1", "pymupdf4llm>=0.3,<1", "langchain-text-splitters>=1,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
lab3 = "core.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
cache-dir = "../data/runtime/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
